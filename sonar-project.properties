# Test files - tells SonarCloud which files are tests
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Source exclusions (tests, vendored and generated code)
sonar.exclusions=**/*_test.go,**/vendor/**,**/*.pb.go

# Coverage exclusions (test helpers, mocks and binary entry points)
sonar.coverage.exclusions=**/*_test.go,**/mock/**,utils/testcerts/**,cmd/**/main.go

# Duplication exclusions (tests and mocks)
sonar.cpd.exclusions=**/*_test.go,**/mock/**
